<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devices · Odin</title>
<link rel="icon" href="assets/brand/logomark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/prototype-bar.css">
</head>
<body>

<div id="shell-root"></div>

<!-- Moved into the Odin content area by renderShell(). -->
<template id="page-template">
  <div class="section-header">
    <h1 class="section-header__title">Devices</h1>
    <div class="section-header__actions">
      <!-- Orders now has its own nav item, so this page offers only the one
           action. It is purple because it is the doorway into the Atlas flow. -->
      <a class="btn btn--brand" href="order.html">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M10 4.167v11.666M4.167 10h11.666" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        Order Devices
      </a>
    </div>
  </div>

  <section class="card" aria-label="Devices">
    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="filter-bar__right">
        <div class="filter-wrap">
          <button class="btn btn--secondary" type="button" id="filters-btn" aria-expanded="false" aria-controls="filters-panel">
            <img src="assets/icons/filters-lines.svg" alt="" width="20" height="20">
            <span>Filters</span>
            <span class="btn__count" id="filters-count" hidden>0</span>
          </button>

          <div class="popover" id="filters-panel" hidden>
            <div class="popover__header">Filters</div>
            <div class="popover__body">
              <fieldset class="field">
                <legend class="field__label">Status</legend>
                <div class="checks" id="filter-status"></div>
              </fieldset>
              <label class="field">
                <span class="field__label">Model</span>
                <select class="select" id="filter-model"><option value="">All models</option></select>
              </label>
              <label class="field">
                <span class="field__label">Business name</span>
                <select class="select" id="filter-business"><option value="">All businesses</option></select>
              </label>
            </div>
            <div class="popover__footer">
              <button class="btn btn--secondary" type="button" id="filters-clear">Clear</button>
              <button class="btn btn--primary" type="button" id="filters-apply">Apply filters</button>
            </div>
          </div>
        </div>

        <button class="btn btn--primary" type="button" id="export-btn">Export</button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-scroll">
      <table class="dt" id="devices-table">
        <thead>
          <tr>
            <th class="dt__th" scope="col">ID</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="business">BUSINESS NAME</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="merchant">MERCHANT NAME</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="deviceName">DEVICE NAME</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="model">MODEL</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="createdAt">CREATED AT</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="updatedAt">UPDATED AT</th>
            <th class="dt__th dt__th--sortable" scope="col" data-sort="status">STATUS</th>
          </tr>
        </thead>
        <tbody id="devices-body"></tbody>
      </table>
      <p class="empty" id="empty-state" hidden>No devices match these filters.</p>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <div class="pagination__left">
        <span class="pagination__viewing" id="viewing">Viewing 1 - 50</span>
        <label class="pagination__rows">
          <span>Rows per page</span>
          <span class="select-wrap">
            <select class="select select--sm" id="per-page">
              <option>10</option><option>25</option><option selected>50</option><option>100</option>
            </select>
            <img src="assets/icons/chevron-down.svg" alt="" width="20" height="20">
          </span>
        </label>
      </div>
      <div class="pagination__actions">
        <button class="btn btn--pager" type="button" id="prev-btn" disabled>Previous</button>
        <button class="btn btn--pager" type="button" id="next-btn">Next</button>
      </div>
    </div>
  </section>
</template>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/shell.js"></script>
<script>renderShell('device-list').append(document.getElementById('page-template').content);</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<!-- The ordering flow's state module, loaded here only so the prototype
     settings bar can read and write the same settings it drives on the
     flow pages. js/app.js is scoped so the two cannot collide. -->
<script src="js/devices-catalogue.js"></script>
<script src="js/order.js"></script>
<script src="js/prototype-bar.js"></script>
</body>
</html>
